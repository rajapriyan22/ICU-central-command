spring.application.name=icu-central-command-backend
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/icu_central_command?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.icucentralcommand=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# JWT Configuration (secret key must be at least 32 characters; random ephemeral key generated if blank)
app.jwt.secret=${JWT_SECRET:}
# JWT token validity period in minutes (default 8 hours)
app.jwt.expiry-minutes=480

# CORS Configuration (allowed origins for browser requests)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
