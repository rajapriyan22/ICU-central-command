spring.application.name=icu-central-command-backend
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/icu_central_command?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=raja2207
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
